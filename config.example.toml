# Agent Resource Badges — example configuration.
# Copy to the path printed by `herdr plugin config-dir agent-resource-badges`
# as config.toml. Changes are picked up within one interval; no restart needed.

interval_seconds = 5   # sampling interval, 1..60; badges expire after three missed intervals

# CPU in percent of ONE core (like `top`), so a busy agent can exceed 100.
cpu_show = 10          # below this (and below ram_show_mb) no badge at all
cpu_warn = 50          # orange from here
cpu_hot  = 100         # red from here

# RAM of the whole process tree below the pane's shell, in MiB.
ram_show_mb = 1536
ram_warn_mb = 2560
ram_hot_mb  = 4096

# "short" (default): the badge names only the metric that set its colour, e.g. "108%" or "2.8G".
# "both": "108% 2.8G" — for sidebars wide enough to show it untruncated.
badge = "short"

# Throttle (off by default). A pane whose tree is at or above throttle_cpu % CPU while
# the pane has NO focus gets its process tree set to nice +throttle_nice (5 = "Low" in
# GNOME System Monitor); the pane you focus goes back to nice 0 at once. Lowering nice
# needs root: either  sudo setcap cap_sys_nice+ep <plugin binary>  or passwordless
# sudo for  <plugin binary> setnice  — without one of them the throttle stays off
# (see the sampler log). Tools that pin nice values, e.g. Ananicy rules for `claude`,
# must not cover the agents; they would undo the throttle every scan. While enabled,
# processes below a pane's shell that run at a NEGATIVE nice value (herdr starts its
# shells with a raised priority) are brought up to 0 as well.
throttle_nice = 0      # 0 = off; 1..19 = nice value for busy, unfocused panes
throttle_cpu  = 90     # % of one core, same metric as the badge
