[package]
name = "agent-resource-badges"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "herdr plugin: traffic-light CPU and RAM badges for each agent in the sidebar, shown only when an agent is busy"
license = "MIT"
repository = "https://github.com/dlepold/herdr-agent-resource-badges"
publish = false

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
